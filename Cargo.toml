[package]
name = "sfm"
version = "0.1.0"
edition = "2021"

[dependencies]
dispatch2 = "0.3.1"
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDictionary",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSUserDefaults",
    "NSValue",
    "NSZone",
] }

[profile.release]
lto = true
strip = true
opt-level = "z"

[package.metadata.bundle]
# cargo-bundle 负责把二进制组装成 Sfm.app，取代原先的 justfile。
# `cargo bundle --release` → target/release/bundle/osx/Sfm.app
name = "Sfm"
identifier = "com.kms.sfm"
version = "0.1.0"
short_description = "菜单栏 CPU / 内存监控"

[package.metadata.bundle.osx]
# 与 Info.plist 里原先的 LSMinimumSystemVersion 一致：objc2-app-kit 0.3 要求 11.0。
minimum_system_version = "11.0"
# cargo-bundle 生成的 plist 键是固定集，没有 LSUIElement（菜单栏应用必须隐藏
# Dock 图标）。info_plist_exts 会在它写完自己的键之后、闭合 </dict> 之前把
# 这些文件的内容原样追加进去。
info_plist_exts = ["packaging/macos/Info.plist-ext.plist"]
