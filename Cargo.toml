[package]
name = "sfm"
version = "0.1.0"
edition = "2021"

[dependencies]
dispatch2 = "0.3.1"
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDictionary",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSUserDefaults",
    "NSValue",
    "NSZone",
] }

[profile.release]
lto = true
strip = true
opt-level = "z"
