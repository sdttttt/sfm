name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 有新提交时取消上一轮，省 runner 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建与单元测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 构建
        uses: Swatinem/rust-cache@v2

      # 仓库没有其他 CI，格式与 lint 在这里统一强制（见 AGENTS.md）。
      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 单元测试
        run: cargo test

      - name: Release 构建
        run: cargo build --release
